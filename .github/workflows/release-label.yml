---
name: Release Label

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: Release Label Check
    uses: miikkak/workflows/.github/workflows/check-release-label.yml@c5052e873a05d4b9ef1ab35afcfe672cd9a86d72 # main
    permissions:
      contents: read
      pull-requests: read
